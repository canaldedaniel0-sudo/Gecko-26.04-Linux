# Your distro. Change anything here, commit, and GitHub Actions builds it.
# Every option is explained at
# https://docs.linuxlive.com/spec/reference/
schema_version: 1
name: Gecko          # up to 40 characters; shown in the boot menu and About screen
version: "26.04"           # keep the quotes
base: ubuntu             # ubuntu or fedora
desktop: kde        # gnome, kde or cinnamon
apps:                    # from Flathub; app ids: https://docs.linuxlive.com/spec/catalog/
  - firefox
branding:
  wallpaper: assets/wallpaper.png   # PNG, at least 1280x720, with one strong colour
  logo: assets/logo.png             # square PNG of 128, 256 or 512 pixels
  accent_color: "#489E21"           # used by KDE and GNOME; keep the quotes
